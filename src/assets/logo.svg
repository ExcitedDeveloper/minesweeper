<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background with same teal color -->
  <rect width="100" height="100" fill="#64FFDA" />
  
  <!-- Code brackets -->
  <path d="M25 30 L15 40 L15 60 L25 70" 
        stroke="#0A192F" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <path d="M75 30 L85 40 L85 60 L75 70" 
        stroke="#0A192F" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Developer initial "H" in the center -->
  <text x="50" y="60" 
        font-family="Arial, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="#0A192F">H</text>
</svg>